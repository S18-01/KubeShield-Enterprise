
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeshield-api
  namespace: kubeshield
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kubeshield-api
  template:
    metadata:
      labels:
        app: kubeshield-api
    spec:
      serviceAccountName: kubeshield-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeshield-api
          image: kubeshield-enterprise:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
