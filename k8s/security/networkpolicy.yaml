
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeshield-default-deny
  namespace: kubeshield
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeshield-allow-api
  namespace: kubeshield
spec:
  podSelector:
    matchLabels:
      app: kubeshield-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
