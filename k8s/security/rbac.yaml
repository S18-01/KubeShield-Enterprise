
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeshield-readonly
  namespace: kubeshield
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeshield-readonly-binding
  namespace: kubeshield
subjects:
  - kind: ServiceAccount
    name: kubeshield-monitor
    namespace: kubeshield
roleRef:
  kind: Role
  name: kubeshield-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeshield-monitor
  namespace: kubeshield
automountServiceAccountToken: false
